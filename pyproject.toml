[project]
name = "geoglyph"
version = "0.1.0"
description = "Command line utility for writing to hilltop from xmls and dsns of xmls"
authors = [
    {name = "SIrvine1994",email = "sam.irvine@horizons.govt.nz"}
]
license = "GNU General Public License v3"
requires-python = ">=3.14.1"
dependencies = [
    "typer>=0.27.1",
]

[project.scripts]
geoglyph = "geoglyph.cli:app"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

dependencies = [
    "typer>=0.27.1",
]

[tool.bumpversion]
current_version = "0.0.0"
commit = true
tag = true
tag_name = "{new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "{current_version}"
replace = "{new_version}"

[[tool.bumpversion.files]]
filename = "src/geoglyph/__init__.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "readme.rst"
search = "{current_version}"
replace = "{new_version}"